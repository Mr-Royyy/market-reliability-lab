# Market Reliability Lab
# Project metadata, dependencies, and development tool settings.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-reliability-lab"
version = "0.1.0"
description = "Researching prediction-market forecast reliability"
requires-python = ">=3.11,<3.13"

# Libraries used by the research pipeline.
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<24",
    "duckdb>=1.1,<2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

# Tools needed during development and testing.
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

# Our Python package lives inside src/.
[tool.setuptools.packages.find]
where = ["src"]

# pytest looks for tests in this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff linting and formatting settings.
[tool.ruff]
line-length = 100
target-version = "py311"